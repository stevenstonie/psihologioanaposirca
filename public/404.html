<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // redirects requests to the root URL, appending the original path as a query param.
        // it ensures github server returns index.html with an HTTP 200 status, passing the requested route data along so random 404 pages do not appear on reload or going back

        // note: if hosting at a subpath (e.g. username.github.io/repo-name/), change this to 1
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replaceAll('&', '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replaceAll('&', '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
