<!doctype html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo80x80.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ioana Poșircă | Psiholog</title>
  <meta name="description"
    content="Cabinet de consiliere psihologică. Te ajut să gestionezi anxietatea, stresul și să îți regăsești echilibrul." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://psihologioanaposirca.ro/" />
  <meta property="og:title" content="Numele Tău | Psihoterapie" />
  <meta property="og:description"
    content="Cabinet de consiliere psihologică. Te ajut să gestionezi anxietatea, stresul și să îți regăsești echilibrul." />
  <meta property="og:image" content="https://psihologioanaposirca.ro/thumbnail-image.jpg" />
</head>

<body>
  <div id="root">
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
      }

      .init-loader-breathing-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        color: #333333;
      }

      .init-loader-breathing {
        width: 40px;
        height: 40px;
        position: relative;
      }

      .init-double-bounce1,
      .init-double-bounce2 {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        opacity: 0.6;
        position: absolute;
        top: 0;
        left: 0;
        animation: sk-bounce 6.0s infinite ease-in-out;
      }

      .init-double-bounce1 {
        background-color: #26b076;
      }

      .init-double-bounce2 {
        background-color: #106d46;
        animation-delay: -3.0s;
      }

      .init-loader-text {
        text-align: center;
      }

      @keyframes sk-bounce {

        0%,
        100% {
          transform: scale(0.0);
        }

        50% {
          transform: scale(1.0);
        }
      }
    </style>

    <div class="init-loader-breathing-container">
      <div class="init-loader-breathing">
        <div class="init-double-bounce1"></div>
        <div class="init-double-bounce2"></div>
      </div>
      <p class="init-loader-text">Ia o gură de aer cât timp se încarcă pagina...</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
