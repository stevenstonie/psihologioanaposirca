<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>psihologioanaposirca</title>
</head>

<body>
  <div id="root">
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
      }

      .loader-breathing-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        color: #333333;
      }

      .loader-breathing {
        width: 40px;
        height: 40px;
        position: relative;
      }

      .double-bounce1,
      .double-bounce2 {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        opacity: 0.6;
        position: absolute;
        top: 0;
        left: 0;
        animation: sk-bounce 2.0s infinite ease-in-out;
      }

      .double-bounce1 {
        background-color: #26b076;
      }

      .double-bounce2 {
        background-color: #106d46;
        animation-delay: -1.0s;
      }

      @keyframes sk-bounce {

        0%,
        100% {
          transform: scale(0.0);
        }

        50% {
          transform: scale(1.0);
        }
      }
    </style>

    <div class="loader-breathing-container">
      <div class="loader-breathing">
        <div class="double-bounce1"></div>
        <div class="double-bounce2"></div>
      </div>
      <p>Ia o gură de aer cât timp se încarcă pagina</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
